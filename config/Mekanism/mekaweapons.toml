#MekaWeapons Settings. Joules to FE conversion: 2.5J = 1FE
#Transfer energy rate of the Wireless Charger (Magnetizer), in Joules per tick.
# Default: 2500000
# Range: 0 ~ 9223372036854775807
wireless_charge_rate = 2500000
#Determines the damage mode of advanced attack amplification modules.
#Allowed Values: BASE_DAMAGE, HALF_BASE_DAMAGE, CUSTOM
module_damage_mode = "HALF_BASE_DAMAGE"
#Determines how much damage advanced attack amplification modules add to weapons. Used only when damage_mode is CUSTOM.
module_damage_custom = 32

#Meka-Tana Settings
[meka_tana]
	#Base damage of Meka-Tana
	base_damage = 32
	#Attack speed of Meka-Tana.
	# Default: -2.4
	# Range: -4.0 ~ 100.0
	attack_speed = -2.4
	#Cost in Joules of using Meka-Tana.
	# Default: 625000
	# Range: 0 ~ 9223372036854775807
	energy_usage = 625000
	#Additional cost in Joules of using Meka-Tana to perform a sweeping attack.
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	sweeping_attack_energy_usage = 125000
	#Cost in Joules of using Meka-Tana to teleport 10 blocks.
	# Default: 5000
	# Range: 0 ~ 9223372036854775807
	teleport_energy_usage = 5000
	#Maximum distance a player can teleport with Meka-Tana.
	# Default: 100
	# Range: 3 ~ 1024
	max_teleport_reach = 100
	#Additional cost in Joules of using Meka-Tana to apply Looting effect to a mob.
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	looting_energy_usage = 125000
	#Base energy capacity of Meka-Tana.
	# Default: 16000000
	# Range: 0 ~ 9223372036854775807
	base_energy_capacity = 16000000
	#Base charge rate of Meka-Tana.
	# Default: 350000
	# Range: 0 ~ 9223372036854775807
	base_charge_rate = 350000
	#Whether Meka-Tana can be enchanted. False by default. Use at your own risk.
	enchantments = false

#Meka-Bow Settings
[meka_bow]
	#Base Damage of Meka-Bow
	base_damage = 32
	#Cost in Joules of using Meka-Bow.
	# Default: 625000
	# Range: 0 ~ 9223372036854775807
	energy_usage = 625000
	#Additional cost in Joules of using Meka-Bow with Energy Arrow Unit active, per shot.
	# Default: 625000
	# Range: 0 ~ 9223372036854775807
	energy_arrow_usage = 625000
	#Additional cost in Joules of using Meka-Bow with Auto-Fire active, per shot.
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	autofire_energy_usage = 125000
	#Additional, cost in Joules of using Meka-Bow with Draw Speed Unit active, multiplied by unit amount, per shot.
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	draw_speed_usage = 125000
	#Additional cost in Joules of using Meka-Bow with Gravity Dampener Unit active, per shot.
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	gravity_dampener_usage = 125000
	#Additional cost in Joules of using Meka-Bow to apply Looting effect
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	looting_energy_usage = 125000
	#Base energy capacity of Meka-Bow.
	# Default: 16000000
	# Range: 0 ~ 9223372036854775807
	base_energy_capacity = 16000000
	#Base charge rate of Meka-Bow.
	# Default: 350000
	# Range: 0 ~ 9223372036854775807
	base_charge_rate = 350000
	#Whether Meka-Bow can be enchanted. False by default. Use at your own risk.
	enchantments = false

#Meka-Gun Settings
[meka_gun]
	#Base damage of Meka-Gun
	base_damage = 32
	#Cost in Joules of using Meka-Gun.
	# Default: 625000
	# Range: 0 ~ 9223372036854775807
	energy_usage = 625000
	#Laser beam length of Meka-Gun, in blocks.
	# Default: 20
	# Range: 1 ~ 1024
	beam_length = 20
	#Additional cost in Joules of using Meka-Gun to apply Looting effect
	# Default: 125000
	# Range: 0 ~ 9223372036854775807
	looting_energy_usage = 125000
	#Max heat percentage of Meka-Gun.
	# Default: 100
	# Range: 1 ~ 10000
	max_heat = 100
	#Heat percentage added to Meka-Gun per shot.
	# Default: 5
	# Range: 1 ~ 10000
	heat_per_shot = 5
	#Heat percentage lost by Meka-Gun per second.
	# Default: 5
	# Range: 1 ~ 10000
	heat_loss_per_second = 5
	#Ticks to wait before Meka-Gun starts cooling down.
	# Default: 20
	# Range: 1 ~ 10000
	cooldown_delay_ticks = 20
	#Ticks between shots of Meka-Gun.
	# Default: 5
	# Range: 1 ~ 10000
	fire_interval = 5
	#Base energy capacity of Meka-Gun.
	# Default: 16000000
	# Range: 0 ~ 9223372036854775807
	base_energy_capacity = 16000000
	#Base charge rate of Meka-Gun.
	# Default: 350000
	# Range: 0 ~ 9223372036854775807
	base_charge_rate = 350000
	#Whether Meka-Gun can be enchanted. False by default. Use at your own risk.
	enchantments = false
