[SourcePipe]
	#魔源管道在无传输需求时的最大休眠时间（tick）。0 = 永不休眠（GUI 也不显示智能休眠开关）。
	# Default: 40
	# Range: 0 ~ 1200
	sourceMaxSleep = 40

	[SourcePipe.BaseUpgrades]
		#无升级时的基础传输速率
		# Default: 50
		# Range: > 1
		sourceRateBase = 50
		#基础升级的传输速率
		# Default: 200
		# Range: > 1
		sourceRateBasic = 200
		#改进升级的传输速率
		# Default: 1000
		# Range: > 1
		sourceRateImproved = 1000
		#高级升级的传输速率
		# Default: 4000
		# Range: > 1
		sourceRateAdvanced = 4000
		#终极升级的传输速率
		# Default: 16000
		# Range: > 1
		sourceRateUltimate = 16000

	[SourcePipe.CustomUpgrades]
		#ATM升级的传输速率
		# Default: 64000
		# Range: > 1
		sourceRateAtm = 64000
		#振金升级的传输速率
		# Default: 256000
		# Range: > 1
		sourceRateVibranium = 256000
		#难得素升级的传输速率
		# Default: 1024000
		# Range: > 1
		sourceRateUnobtainium = 1024000
		#恒星合金升级的传输速率
		# Default: 4096000
		# Range: > 1
		sourceRateStellar = 4096000

[PressurePipe]
	#气压超过管道承压极限时是否发生爆炸
	enableExplosion = true
	#气压管道在无传输需求时的最大休眠时间（tick）。0 = 永不休眠（GUI 也不显示智能休眠开关）。
	# Default: 40
	# Range: 0 ~ 1200
	pressureMaxSleep = 40
	#气压管道检测到超压后、爆炸前的宽限 tick 数。期间管道漏气嘶鸣且不传输，留出插入更强升级或扳手切回的时间。
	# Default: 60
	# Range: 1 ~ 1200
	leakGraceTicks = 60
	#气压管道超压漏气时，每多少 tick 播一次预警声/喷一次粒子。
	# Default: 10
	# Range: 1 ~ 200
	leakWarningInterval = 10

	[PressurePipe.Rates]
		#无升级时的基础传输速率 (mL/t)
		# Default: 100
		# Range: > 1
		rateBase = 100
		#基础升级的传输速率
		# Default: 500
		# Range: > 1
		rateBasic = 500
		#改进升级的传输速率
		# Default: 2000
		# Range: > 1
		rateImproved = 2000
		#高级升级的传输速率
		# Default: 10000
		# Range: > 1
		rateAdvanced = 10000
		#终极升级的传输速率
		# Default: 50000
		# Range: > 1
		rateUltimate = 50000
		#ATM升级的传输速率
		# Default: 200000
		# Range: > 1
		rateAtm = 200000
		#振金升级的传输速率
		# Default: 1000000
		# Range: > 1
		rateVibranium = 1000000
		#难得素升级的传输速率
		# Default: 4000000
		# Range: > 1
		rateUnobtainium = 4000000
		#恒星合金升级的传输速率
		# Default: 16000000
		# Range: > 1
		rateStellar = 16000000

	[PressurePipe.MaxPressure]
		# Default: 7.0
		# Range: 0.0 ~ 1000.0
		maxBase = 7.0
		# Default: 7.0
		# Range: 0.0 ~ 1000.0
		maxBasic = 7.0
		# Default: 7.0
		# Range: 0.0 ~ 1000.0
		maxImproved = 7.0
		# Default: 7.0
		# Range: 0.0 ~ 1000.0
		maxAdvanced = 7.0
		# Default: 25.0
		# Range: 0.0 ~ 1000.0
		maxUltimate = 25.0
		# Default: 25.0
		# Range: 0.0 ~ 1000.0
		maxAtm = 25.0
		# Default: 25.0
		# Range: 0.0 ~ 1000.0
		maxVibranium = 25.0
		# Default: 25.0
		# Range: 0.0 ~ 1000.0
		maxUnobtainium = 25.0
		# Default: 50.0
		# Range: 0.0 ~ 1000.0
		maxStellar = 50.0
